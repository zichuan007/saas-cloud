server:
  port: 8085

spring:
  application:
    name: notify-service
  config:
    import:
      - optional:nacos:notify-service.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/notify?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    consumer:
      group-id: notify-service
      auto-offset-reset: earliest
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:e96d2e6b-7bf3-4a42-973a-e020a213cde2}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:e96d2e6b-7bf3-4a42-973a-e020a213cde2}
        file-extension: yml
  boot:
    admin:
      client:
        url: http://${SBA_HOST:localhost}:9090
        instance:
          prefer-ip: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    admin-addresses: http://${XXL_JOB_HOST:127.0.0.1}:8088/xxl-job-admin
    access-token: ${XXL_JOB_TOKEN:saas-cloud-xxl-token}
    executor-appname: notify-service
    executor-port: 0

sms:
  config-type: yaml
  blends:
    alibaba:
      access-key-id: ${SMS_ACCESS_KEY:}
      access-key-secret: ${SMS_ACCESS_SECRET:}
      signature: ${SMS_SIGNATURE:}
      template-id: ${SMS_TEMPLATE_ID:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans
