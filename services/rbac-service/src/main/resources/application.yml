server:
  port: 8081

spring:
  application:
    name: rbac-service
  config:
    import:
      - optional:nacos:rbac-service.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/rbac?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
  kafka:
    bootstrap-servers: ${KAFKA_ADDR:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:e96d2e6b-7bf3-4a42-973a-e020a213cde2}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:e96d2e6b-7bf3-4a42-973a-e020a213cde2}
        file-extension: yml
  boot:
    admin:
      client:
        url: http://${SBA_HOST:localhost}:9090
        instance:
          prefer-ip: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 7200
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

aj:
  captcha:
    cache-type: redis
    type: blockPuzzle
    water-mark: saas-cloud
    jigsaw: classpath:images/jigsaw
    pic-click: classpath:images/pic-click
    interference-options: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleteFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

xxl:
  job:
    admin-addresses: http://${XXL_JOB_HOST:127.0.0.1}:8088/xxl-job-admin
    access-token: ${XXL_JOB_TOKEN:saas-cloud-xxl-token}
    executor-appname: rbac-service
    executor-port: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:localhost}:9411/api/v2/spans

social:
  login:
    platforms:
      github:
        client-id: ${SOCIAL_GITHUB_CLIENT_ID:}
        client-secret: ${SOCIAL_GITHUB_CLIENT_SECRET:}
        redirect-uri: ${SOCIAL_GITHUB_REDIRECT_URI:http://localhost:8080/api/rbac/auth/social/github/callback}
      gitee:
        client-id: ${SOCIAL_GITEE_CLIENT_ID:}
        client-secret: ${SOCIAL_GITEE_CLIENT_SECRET:}
        redirect-uri: ${SOCIAL_GITEE_REDIRECT_URI:http://localhost:8080/api/rbac/auth/social/gitee/callback}
      wechat:
        client-id: ${SOCIAL_WECHAT_CLIENT_ID:}
        client-secret: ${SOCIAL_WECHAT_CLIENT_SECRET:}
        redirect-uri: ${SOCIAL_WECHAT_REDIRECT_URI:http://localhost:8080/api/rbac/auth/social/wechat/callback}
      dingtalk:
        client-id: ${SOCIAL_DINGTALK_CLIENT_ID:}
        client-secret: ${SOCIAL_DINGTALK_CLIENT_SECRET:}
        redirect-uri: ${SOCIAL_DINGTALK_REDIRECT_URI:http://localhost:8080/api/rbac/auth/social/dingtalk/callback}
