version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: saas-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - saas-cloud-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7
    container_name: saas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - saas-cloud-net

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: saas-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    depends_on:
      - mysql
    networks:
      - saas-cloud-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: saas-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - saas-cloud-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: saas-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - saas-cloud-net

  zipkin:
    image: openzipkin/zipkin:3
    container_name: saas-zipkin
    restart: always
    ports:
      - "9411:9411"
    networks:
      - saas-cloud-net

  spring-boot-admin:
    image: codecentric/spring-boot-admin:3.4.5
    container_name: saas-spring-boot-admin
    restart: always
    ports:
      - "9090:8080"
    networks:
      - saas-cloud-net

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.1.1
    container_name: saas-xxl-job-admin
    restart: always
    ports:
      - "8088:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root
        --xxl.job.accessToken=saas-cloud-xxl-token
    depends_on:
      - mysql
    networks:
      - saas-cloud-net

  minio:
    image: minio/minio
    container_name: saas-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - saas-cloud-net

volumes:
  mysql-data:
  redis-data:
  zookeeper-data:
  kafka-data:
  minio-data:

networks:
  saas-cloud-net:
    driver: bridge
